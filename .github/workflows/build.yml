name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # Change this value (e.g., from v1 to v2) to force a total cache refresh
        cache-read-only: false
      env:
        CACHE_BUSTER: v1 
    
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
    
    # This command explicitly ignores old cached dependencies
    - name: Build with Gradle
      run: ./gradlew build --refresh-dependencies
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: build/libs/
